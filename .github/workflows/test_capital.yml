name: Test Capital.com API

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Test Capital.com login
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
        run: |
          pip install requests
          python3 << 'EOF'
          import requests, os

          url = "https://demo-api-capital.backend-capital.com/api/v1/session"
          headers = {
              "X-CAP-API-KEY": os.environ["CAPITAL_API_KEY"],
              "Content-Type": "application/json"
          }
          payload = {
              "identifier": os.environ["CAPITAL_IDENTIFIER"],
              "password": os.environ["CAPITAL_API_PASSWORD"]
          }

          r = requests.post(url, json=payload, headers=headers)
          print("Status code:", r.status_code)
          print("Response:", r.text)

          if r.status_code == 200:
              print("✅ الاتصال نجح!")
              print("CST token:", r.headers.get("CST"))
              print("Security token:", r.headers.get("X-SECURITY-TOKEN"))
          else:
              print("❌ فشل الاتصال")
          EOF
