name: Backtest Multi-Timeframe

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Run multi-timeframe backtest
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          pip install requests pandas
          python3 << 'EOF'
          import requests, os, time
          import pandas as pd

          TWELVE_DATA_KEY = os.environ["TWELVE_DATA_KEY"]
          RR_RATIO = 2
          ATR_MULTIPLIER = 1.5
          PAIRS = ["EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "AUD/USD",
                   "USD/CAD", "GBP/JPY", "EUR/JPY"]

          def fetch_history(pair, interval, size=1000):
              url = "https://api.twelvedata.com/time_series"
              params = {"symbol": pair, "interval": interval, "outputsize": size, "apikey": TWELVE_DATA_KEY}
              r = requests.get(url, params=params, timeout=30)
              data = r.json()
              values = data.get("values")
              if not values:
                  return None
              df = pd.DataFrame(values)
              df["datetime"] = pd.to_datetime(df["datetime"])
              df["close"] = df["close"].astype(float)
              df["high"] = df["high"].astype(float)
              df["low"] = df["low"].astype(float)
              df = df.iloc[::-1].reset_index(drop=True)
              return df

          def find_nearest_levels(df, window=5):
              highs = df["high"]; lows = df["low"]; price = df["close"].iloc[-1]
              swing_highs = []; swing_lows = []
              for i in range(window, len(df) - window):
                  wh = highs.iloc[i-window:i+window+1]
                  wl = lows.iloc[i-window:i+window+1]
                  if highs.iloc[i] == wh.max():
                      swing_highs.append(highs.iloc[i])
                  if lows.iloc[i] == wl.min():
                      swing_lows.append(lows.iloc[i])
              resistances_above = [h for h in swing_highs if h > price]
              supports_below = [l for l in swing_lows if l < price]
              resistance = min(resistances_above) if resistances_above else highs.max()
              support = max(supports_below) if supports_below else lows.min()
              return support, resistance

          def compute_indicators(df):
              close = df["close"]; high = df["high"]; low = df["low"]
              ema50 = close.ewm(span=50).mean().iloc[-1]
              ema200 = close.ewm(span=200).mean().iloc[-1]
              delta = close.diff()
              gain = delta.where(delta > 0, 0).rolling(14).mean()
              loss = -delta.where(delta < 0, 0).rolling(14).mean()
              rs = gain / loss
              rsi = (100 - (100 / (1 + rs))).iloc[-1]
              tr = pd.concat([high - low, (high - close.shift()).abs(), (low - close.shift()).abs()], axis=1).max(axis=1)
              atr = tr.rolling(14).mean().iloc[-1]
              plus_dm = (high.diff()).clip(lower=0)
              minus_dm = (-low.diff()).clip(lower=0)
              plus_di = 100 * (plus_dm.rolling(14).mean() / tr.rolling(14).mean())
              minus_di = 100 * (minus_dm.rolling(14).mean() / tr.rolling(14).mean())
              dx = (abs(plus_di - minus_di) / (plus_di + minus_di)) * 100
              adx = dx.rolling(14).mean().iloc[-1]
              price = close.iloc[-1]
              support, resistance = find_nearest_levels(df)
              support_prev, resistance_prev = find_nearest_levels(df.iloc[:-1])
              bullish_breakout = price > resistance_prev
              bearish_breakout = price < support_prev
              return {
                  "price": price, "atr": atr, "rsi": rsi, "adx": adx,
                  "bullish_breakout": bool(bullish_breakout),
                  "bearish_breakout": bool(bearish_breakout),
                  "trend_up": ema50 > ema200,
                  "trend_down": ema50 < ema200,
                  "adx_ok": adx > 25,
              }

          def passes_conditions(ind):
              if not ind["adx_ok"]:
                  return None
              if ind["trend_up"] and ind["bullish_breakout"] and ind["rsi"] > 55:
                  return "صاعد"
              if ind["trend_down"] and ind["bearish_breakout"] and ind["rsi"] < 45:
                  return "هابط"
              return None

          def get_htf_trend(htf_df, current_time):
              past = htf_df[htf_df["datetime"] <= current_time]
              if len(past) < 210:
                  return None
              close = past["close"]
              ema50 = close.ewm(span=50).mean().iloc[-1]
              ema200 = close.ewm(span=200).mean().iloc[-1]
              if ema50 > ema200:
                  return "صاعد"
              elif ema50 < ema200:
                  return "هابط"
              return None

          def backtest_pair_mtf(ltf_df, htf_df):
              trades = []
              in_trade = False
              stop = target = trade_direction = None
              i = 300
              while i < len(ltf_df) - 1:
                  if not in_trade:
                      window_df = ltf_df.iloc[:i+1]
                      ind = compute_indicators(window_df)
                      direction = passes_conditions(ind)
                      if direction:
                          current_time = ltf_df.iloc[i]["datetime"]
                          htf_trend = get_htf_trend(htf_df, current_time)
                          if htf_trend == direction:
                              entry = ind["price"]
                              stop_dist = ind["atr"] * ATR_MULTIPLIER
                              profit_dist = stop_dist * RR_RATIO
                              if direction == "صاعد":
                                  stop = entry - stop_dist
                                  target = entry + profit_dist
                              else:
                                  stop = entry + stop_dist
                                  target = entry - profit_dist
                              in_trade = True
                              trade_direction = direction
                  else:
                      candle = ltf_df.iloc[i]
                      hit_target = hit_stop = False
                      if trade_direction == "صاعد":
                          if candle["low"] <= stop:
                              hit_stop = True
                          elif candle["high"] >= target:
                              hit_target = True
                      else:
                          if candle["high"] >= stop:
                              hit_stop = True
                          elif candle["low"] <= target:
                              hit_target = True
                      if hit_target or hit_stop:
                          trades.append({"result": "ربح" if hit_target else "خسارة"})
                          in_trade = False
                  i += 1
              return trades

          print("بدء باك تيست تأكيد الفريمين (ساعة للاتجاه + 15 دقيقة للدخول)")
          all_results = {}
          for pair in PAIRS:
              ltf_df = fetch_history(pair, "15min", 1000)
              time.sleep(8)
              htf_df = fetch_history(pair, "1h", 500)
              time.sleep(8)
              if ltf_df is None or htf_df is None or len(ltf_df) < 350 or len(htf_df) < 210:
                  print(f"{pair}: بيانات غير كافية")
                  continue
              trades = backtest_pair_mtf(ltf_df, htf_df)
              wins = sum(1 for t in trades if t["result"] == "ربح")
              losses = sum(1 for t in trades if t["result"] == "خسارة")
              total = len(trades)
              winrate = round((wins / total) * 100, 1) if total else 0
              print(f"===== {pair} =====")
              print(f"عدد الصفقات: {total} | ربح: {wins} | خسارة: {losses} | نسبة النجاح: {winrate}%")
              all_results[pair] = {"total": total, "wins": wins, "losses": losses}

          total_trades = sum(v["total"] for v in all_results.values())
          total_wins = sum(v["wins"] for v in all_results.values())
          overall_winrate = round((total_wins / total_trades) * 100, 1) if total_trades else 0
          print("===== الإجمالي (تأكيد ساعة + 15 دقيقة) =====")
          print(f"إجمالي الصفقات: {total_trades} | نسبة النجاح الكلية: {overall_winrate}%")
          print("للمقارنة: 15 دقيقة بدون تأكيد كانت 32.5%")
          EOF
