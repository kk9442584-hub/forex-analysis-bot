name: Backtest Gemini Filter

on:
  workflow_dispatch:

jobs:
  backtest-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Run Gemini backtest
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          pip install requests pandas matplotlib
          python3 << 'EOF'
          import requests, os, time, io, base64, json
          import pandas as pd
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt

          TWELVE_DATA_KEY = os.environ["TWELVE_DATA_KEY"]
          GEMINI_KEY = os.environ["GEMINI_KEY"]
          RR_RATIO = 2
          ATR_MULTIPLIER = 1.5
          MAX_SAMPLES_PER_PAIR = 5
          PAIRS = ["EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "AUD/USD",
                   "USD/CAD", "GBP/JPY", "EUR/JPY"]

          def fetch_history(pair):
              url = "https://api.twelvedata.com/time_series"
              params = {"symbol": pair, "interval": "15min", "outputsize": 1000, "apikey": TWELVE_DATA_KEY}
              r = requests.get(url, params=params, timeout=30)
              data = r.json()
              values = data.get("values")
              if not values:
                  return None
              df = pd.DataFrame(values)
              df["close"] = df["close"].astype(float)
              df["high"] = df["high"].astype(float)
              df["low"] = df["low"].astype(float)
              df = df.iloc[::-1].reset_index(drop=True)
              return df

          def find_nearest_levels(df, window=5):
              highs = df["high"]; lows = df["low"]; price = df["close"].iloc[-1]
              swing_highs = []; swing_lows = []
              for i in range(window, len(df) - window):
                  wh = highs.iloc[i-window:i+window+1]
                  wl = lows.iloc[i-window:i+window+1]
                  if highs.iloc[i] == wh.max():
                      swing_highs.append(highs.iloc[i])
                  if lows.iloc[i] == wl.min():
                      swing_lows.append(lows.iloc[i])
              resistances_above = [h for h in swing_highs if h > price]
              supports_below = [l for l in swing_lows if l < price]
              resistance = min(resistances_above) if resistances_above else highs.max()
              support = max(supports_below) if supports_below else lows.min()
              return support, resistance

          def compute_indicators(df):
              close = df["close"]; high = df["high"]; low = df["low"]
              ema50 = close.ewm(span=50).mean().iloc[-1]
              ema200 = close.ewm(span=200).mean().iloc[-1]
              delta = close.diff()
              gain = delta.where(delta > 0, 0).rolling(14).mean()
              loss = -delta.where(delta < 0, 0).rolling(14).mean()
              rs = gain / loss
              rsi = (100 - (100 / (1 + rs))).iloc[-1]
              tr = pd.concat([high - low, (high - close.shift()).abs(), (low - close.shift()).abs()], axis=1).max(axis=1)
              atr = tr.rolling(14).mean().iloc[-1]
              plus_dm = (high.diff()).clip(lower=0)
              minus_dm = (-low.diff()).clip(lower=0)
              plus_di = 100 * (plus_dm.rolling(14).mean() / tr.rolling(14).mean())
              minus_di = 100 * (minus_dm.rolling(14).mean() / tr.rolling(14).mean())
              dx = (abs(plus_di - minus_di) / (plus_di + minus_di)) * 100
              adx = dx.rolling(14).mean().iloc[-1]
              price = close.iloc[-1]
              support, resistance = find_nearest_levels(df)
              support_prev, resistance_prev = find_nearest_levels(df.iloc[:-1])
              bullish_breakout = price > resistance_prev
              bearish_breakout = price < support_prev
              return {
                  "price": round(price, 5), "atr": round(atr, 5),
                  "rsi": round(rsi, 2), "adx": round(adx, 2),
                  "support": round(support, 5), "resistance": round(resistance, 5),
                  "bullish_breakout": bool(bullish_breakout),
                  "bearish_breakout": bool(bearish_breakout),
                  "trend_up": ema50 > ema200, "trend_down": ema50 < ema200,
                  "adx_ok": adx > 25,
              }

          def passes_conditions(ind):
              if not ind["adx_ok"]:
                  return None
              if ind["trend_up"] and ind["bullish_breakout"] and ind["rsi"] > 55:
                  return "صاعد"
              if ind["trend_down"] and ind["bearish_breakout"] and ind["rsi"] < 45:
                  return "هابط"
              return None

          def generate_chart(df, pair, support, resistance):
              fig, ax = plt.subplots(figsize=(8, 4.5), dpi=100)
              ax.plot(df["close"].tail(120).values, color="#2196F3", linewidth=1.3, label="السعر")
              ax.axhline(support, color="#4CAF50", linestyle="--", linewidth=1, label="دعم")
              ax.axhline(resistance, color="#F44336", linestyle="--", linewidth=1, label="مقاومة")
              ax.set_title(pair)
              ax.legend(loc="upper left", fontsize=8)
              ax.grid(alpha=0.2)
              buf = io.BytesIO()
              plt.tight_layout()
              fig.savefig(buf, format="png")
              plt.close(fig)
              buf.seek(0)
              return base64.b64encode(buf.read()).decode("utf-8")

          def ask_gemini(pair, direction, ind, chart_b64):
              news_text = "هذا اختبار رجعي (Backtest) - لا تتوفر بيانات أخبار دقيقة لهذه اللحظة التاريخية، تجاهل تأثير الأخبار وركز فقط على الشكل الفني للشارت والمؤشرات."
              prompt = f"""أنت محلل فني محترف للفوركس. زوج {pair} حقق اختراقاً فعلياً {direction}. المستوى فني مهم, والمؤشرات تدعم اتجاه {direction}. المعطيات الفنية: - السعر الحالي: {ind['price']} - الدعم: {ind['support']} - المقاومة: {ind['resistance']} - RSI: {ind['rsi']} - ADX: {ind['adx']} {news_text} معك أيضاً صورة الشارت الفعلية. رد بصيغة JSON فقط بهذا الشكل: {{ "decision": "GO" أو "SKIP", "skip_reason": "سبب مختصر لو SKIP، وإلا فارغ" }} لا تكتب أي نص خارج الـ JSON."""
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key={GEMINI_KEY}"
              body = {
                  "contents": [{"parts": [{"text": prompt}, {"inline_data": {"mime_type": "image/png", "data": chart_b64}}]}],
                  "generationConfig": {"response_mime_type": "application/json", "thinking_config": {"thinking_budget": 0}}
              }
              try:
                  r = requests.post(url, json=body, timeout=90)
                  result = r.json()
                  raw = result["candidates"][0]["content"]["parts"][0]["text"].strip()
                  parsed = json.loads(raw)
                  return parsed.get("decision", "SKIP").strip().upper()
              except Exception as e:
                  print(f"خطأ Gemini: {e}")
                  return "ERROR"

          def find_trades_with_context(df):
              trades = []
              in_trade = False
              stop = target = trade_direction = None
              entry_index = None
              i = 300
              while i < len(df) - 1:
                  if not in_trade:
                      window_df = df.iloc[:i+1]
                      ind = compute_indicators(window_df)
                      direction = passes_conditions(ind)
                      if direction:
                          entry = ind["price"]
                          stop_dist = ind["atr"] * ATR_MULTIPLIER
                          profit_dist = stop_dist * RR_RATIO
                          if direction == "صاعد":
                              stop = entry - stop_dist; target = entry + profit_dist
                          else:
                              stop = entry + stop_dist; target = entry - profit_dist
                          in_trade = True
                          entry_index = i
                          trade_direction = direction
                          entry_ind = ind
                  else:
                      candle = df.iloc[i]
                      hit_target = hit_stop = False
                      if trade_direction == "صاعد":
                          if candle["low"] <= stop: hit_stop = True
                          elif candle["high"] >= target: hit_target = True
                      else:
                          if candle["high"] >= stop: hit_stop = True
                          elif candle["low"] <= target: hit_target = True
                      if hit_target or hit_stop:
                          trades.append({
                              "entry_index": entry_index, "direction": trade_direction,
                              "result": "ربح" if hit_target else "خسارة", "ind": entry_ind,
                          })
                          in_trade = False
                  i += 1
              return trades

          print("بدء اختبار تأثير فلترة Gemini (عينة من كل زوج)")
          go_results = []
          skip_results = []

          for pair in PAIRS:
              df = fetch_history(pair)
              if df is None or len(df) < 350:
                  print(f"{pair}: بيانات غير كافية")
                  continue
              trades = find_trades_with_context(df)
              sample = trades[:MAX_SAMPLES_PER_PAIR]
              print(f"===== {pair} ===== (عينة {len(sample)} من أصل {len(trades)} صفقة)")
              for t in sample:
                  window_df = df.iloc[:t["entry_index"]+1]
                  chart_b64 = generate_chart(window_df, pair, t["ind"]["support"], t["ind"]["resistance"])
                  decision = ask_gemini(pair, t["direction"], t["ind"], chart_b64)
                  print(f" صفقة #{t['entry_index']} | اتجاه: {t['direction']} | نتيجة فعلية: {t['result']} | قرار Gemini: {decision}")
                  if decision == "GO":
                      go_results.append(t["result"])
                  elif decision == "SKIP":
                      skip_results.append(t["result"])
                  time.sleep(6)
              time.sleep(8)

          def winrate(results):
              if not results:
                  return 0, 0
              wins = sum(1 for r in results if r == "ربح")
              return wins, round((wins / len(results)) * 100, 1)

          go_wins, go_rate = winrate(go_results)
          skip_wins, skip_rate = winrate(skip_results)

          print("===== النتيجة النهائية =====")
          print(f"صفقات وافق عليها Gemini (GO): {len(go_results)} | ربح: {go_wins} | نسبة النجاح: {go_rate}%")
          print(f"صفقات رفضها Gemini (SKIP): {len(skip_results)} | كانت ستربح: {skip_wins} | نسبة النجاح لو نُفذت: {skip_rate}%")
          print("نسبة النجاح الإجمالية بدون فلترة (من الباك تيست السابق): 32.5%")
          EOF
