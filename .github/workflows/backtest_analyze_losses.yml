name: Trend Following Strategy

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Trend following backtest
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          pip install requests pandas numpy
          python3 << 'EOF'
          import requests, os, time
          import pandas as pd
          import numpy as np

          TWELVE_DATA_KEY = os.environ["TWELVE_DATA_KEY"]
          PAIRS = ["EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "AUD/USD"]
          
          # إعدادات
          EMA_FAST = 20
          EMA_SLOW = 50
          RSI_PERIOD = 14
          ATR_PERIOD = 14
          SL_MULT = 1.0    # ستوب: 1x ATR
          TP_MULT = 2.0    # هدف: 2x ATR
          RISK_REWARD = 2  # R:R = 1:2

          def fetch_data(pair, interval, outputsize=1000):
              url = "https://api.twelvedata.com/time_series"
              params = {"symbol": pair, "interval": interval, "outputsize": outputsize, "apikey": TWELVE_DATA_KEY}
              r = requests.get(url, params=params, timeout=30)
              data = r.json()
              values = data.get("values")
              if not values:
                  return None
              df = pd.DataFrame(values)
              for col in ["close", "high", "low", "open"]:
                  df[col] = df[col].astype(float)
              df = df.iloc[::-1].reset_index(drop=True)
              return df

          def add_indicators(df):
              close = df["close"]
              high = df["high"]
              low = df["low"]
              
              # EMA
              df["ema_fast"] = close.ewm(span=EMA_FAST).mean()
              df["ema_slow"] = close.ewm(span=EMA_SLOW).mean()
              
              # RSI
              delta = close.diff()
              gain = delta.where(delta > 0, 0).rolling(RSI_PERIOD).mean()
              loss = -delta.where(delta < 0, 0).rolling(RSI_PERIOD).mean()
              rs = gain / loss
              df["rsi"] = 100 - (100 / (1 + rs))
              
              # ATR
              tr = pd.concat([
                  high - low,
                  (high - close.shift()).abs(),
                  (low - close.shift()).abs()
              ], axis=1).max(axis=1)
              df["atr"] = tr.rolling(ATR_PERIOD).mean()
              
              return df

          def check_signal(df, i):
              if i < 60:
                  return None
              
              current = df.iloc[i]
              prev = df.iloc[i-1]
              
              # الترند
              trend_up = current["ema_fast"] > current["ema_slow"]
              trend_down = current["ema_fast"] < current["ema_slow"]
              
              # RSI في منطقة معقولة
              rsi_ok = 30 < current["rsi"] < 70
              
              if not rsi_ok:
                  return None
              
              # إشارة شراء: ارتداد لـ EMA_fast في ترند صاعد
              if trend_up:
                  # السعر لمس أو كسر EMA_fast ثم رجع فوقها
                  if prev["low"] <= prev["ema_fast"] and current["close"] > current["ema_fast"]:
                      return "صاعد"
              
              # إشارة بيع: ارتداد لـ EMA_fast في ترند هابط
              if trend_down:
                  if prev["high"] >= prev["ema_fast"] and current["close"] < current["ema_fast"]:
                      return "هابط"
              
              return None

          def backtest(df):
              trades = []
              in_trade = False
              current_trade = None
              
              for i in range(60, len(df) - 1):
                  if not in_trade:
                      signal = check_signal(df, i)
                      if signal:
                          entry = df.iloc[i+1]["open"]
                          atr = df.iloc[i]["atr"]
                          if signal == "صاعد":
                              stop = entry - (atr * SL_MULT)
                              target = entry + (atr * SL_MULT * RISK_REWARD)
                          else:
                              stop = entry + (atr * SL_MULT)
                              target = entry - (atr * SL_MULT * RISK_REWARD)
                          
                          in_trade = True
                          current_trade = {"entry": entry, "stop": stop, "target": target, "direction": signal}
                  else:
                      candle = df.iloc[i+1]
                      
                      if current_trade["direction"] == "صاعد":
                          if candle["low"] <= current_trade["stop"]:
                              trades.append("خسارة")
                              in_trade = False
                          elif candle["high"] >= current_trade["target"]:
                              trades.append("ربح")
                              in_trade = False
                      else:
                          if candle["high"] >= current_trade["stop"]:
                              trades.append("خسارة")
                              in_trade = False
                          elif candle["low"] <= current_trade["target"]:
                              trades.append("ربح")
                              in_trade = False
              
              return trades

          print("=" * 70)
          print("📈 باك تست استراتيجية متابعة الترند (Trend Following)")
          print(f"EMA: {EMA_FAST}/{EMA_SLOW} | SL: {SL_MULT}x ATR | TP: {RISK_REWARD}x SL | R:R = 1:{RISK_REWARD}")
          print("=" * 70)
          
          all_results = {}
          for pair in PAIRS:
              print(f"\n⏳ جاري تحليل {pair}...")
              df = fetch_data(pair, "15min", 2000)
              if df is None or len(df) < 200:
                  print(f"❌ {pair}: بيانات غير كافية")
                  continue
              
              df = add_indicators(df)
              trades = backtest(df)
              wins = trades.count("ربح")
              losses = trades.count("خسارة")
              total = len(trades)
              winrate = round((wins / total) * 100, 1) if total else 0
              
              # حساب الربح الصافي (R:R = 1:2)
              net_profit_r = (wins * RISK_REWARD) - losses
              total_r = wins * RISK_REWARD + losses
              profit_pct = round((net_profit_r / total_r) * 100, 1) if total_r else 0
              
              print(f"📊 {pair}: {total} صفقة | ربح: {wins} | خسارة: {losses} | WR: {winrate}% | ربح: {profit_pct}%")
              all_results[pair] = {"total": total, "wins": wins, "losses": losses, "profit_pct": profit_pct}
              time.sleep(8)

          total_trades = sum(v["total"] for v in all_results.values())
          total_wins = sum(v["wins"] for v in all_results.values())
          total_losses = sum(v["losses"] for v in all_results.values())
          overall_winrate = round((total_wins / total_trades) * 100, 1) if total_trades else 0
          
          net_profit_r = (total_wins * RISK_REWARD) - total_losses
          total_r = total_wins * RISK_REWARD + total_losses
          overall_profit_pct = round((net_profit_r / total_r) * 100, 1) if total_r else 0
          
          print()
          print("=" * 70)
          print("📈 الإجمالي")
          print("=" * 70)
          print(f"إجمالي: {total_trades} | ربح: {total_wins} | خسارة: {total_losses}")
          print(f"Win Rate: {overall_winrate}% | الربح الصافي: {overall_profit_pct}%")
          print()
          print("📋 المقارنة:")
          print("  - القديم: 31.5% (R:R 1:2 → -6.5%)")
          print("  - الوسط: 35.4% (R:R 1:2 → -1.4%)")
          print(f"  - 🆕 المتابعة: {overall_winrate}% (R:R 1:{RISK_REWARD} → {overall_profit_pct}%)")
          
          if overall_profit_pct > 0:
              print(f"🎉 ربح! الهدف تحقق!")
          print("=" * 70)
          EOF
