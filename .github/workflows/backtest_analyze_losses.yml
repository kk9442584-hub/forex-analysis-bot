name: Backtest With Indicators

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Run backtest with multiple indicators
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          pip install requests pandas
          python3 << 'EOF'
          import requests, os, time
          import pandas as pd
          import numpy as np

          TWELVE_DATA_KEY = os.environ["TWELVE_DATA_KEY"]
          RR_RATIO = 2
          ATR_MULTIPLIER = 1.5
          ADX_THRESHOLD = 25
          RSI_BUY_THRESHOLD = 60
          RSI_SELL_THRESHOLD = 40
          PAIRS = ["EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "AUD/USD", "USD/CAD"]

          def fetch_history(pair):
              url = "https://api.twelvedata.com/time_series"
              params = {"symbol": pair, "interval": "15min", "outputsize": 1000, "apikey": TWELVE_DATA_KEY}
              r = requests.get(url, params=params, timeout=30)
              data = r.json()
              values = data.get("values")
              if not values:
                  return None
              df = pd.DataFrame(values)
              df["close"] = df["close"].astype(float)
              df["high"] = df["high"].astype(float)
              df["low"] = df["low"].astype(float)
              df = df.iloc[::-1].reset_index(drop=True)
              return df

          def find_nearest_levels(df, window=5):
              highs = df["high"]; lows = df["low"]; price = df["close"].iloc[-1]
              swing_highs = []; swing_lows = []
              for i in range(window, len(df) - window):
                  wh = highs.iloc[i-window:i+window+1]
                  wl = lows.iloc[i-window:i+window+1]
                  if highs.iloc[i] == wh.max():
                      swing_highs.append(highs.iloc[i])
                  if lows.iloc[i] == wl.min():
                      swing_lows.append(lows.iloc[i])
              resistances_above = [h for h in swing_highs if h > price]
              supports_below = [l for l in swing_lows if l < price]
              resistance = min(resistances_above) if resistances_above else highs.max()
              support = max(supports_below) if supports_below else lows.min()
              return support, resistance

          def compute_indicators(df):
              close = df["close"]; high = df["high"]; low = df["low"]
              
              # EMA
              ema50 = close.ewm(span=50).mean().iloc[-1]
              ema200 = close.ewm(span=200).mean().iloc[-1]
              
              # RSI
              delta = close.diff()
              gain = delta.where(delta > 0, 0).rolling(14).mean()
              loss = -delta.where(delta < 0, 0).rolling(14).mean()
              rs = gain / loss
              rsi = (100 - (100 / (1 + rs))).iloc[-1]
              
              # ATR
              tr = pd.concat([high - low, (high - close.shift()).abs(), (low - close.shift()).abs()], axis=1).max(axis=1)
              atr = tr.rolling(14).mean().iloc[-1]
              
              # ADX
              plus_dm = (high.diff()).clip(lower=0)
              minus_dm = (-low.diff()).clip(lower=0)
              plus_di = 100 * (plus_dm.rolling(14).mean() / tr.rolling(14).mean())
              minus_di = 100 * (minus_dm.rolling(14).mean() / tr.rolling(14).mean())
              dx = (abs(plus_di - minus_di) / (plus_di + minus_di)) * 100
              adx = dx.rolling(14).mean().iloc[-1]
              
              # ✅ MACD
              ema12 = close.ewm(span=12).mean()
              ema26 = close.ewm(span=26).mean()
              macd_line = ema12 - ema26
              signal_line = macd_line.ewm(span=9).mean()
              macd_hist = macd_line.iloc[-1] - signal_line.iloc[-1]
              macd_prev = macd_line.iloc[-2] - signal_line.iloc[-2]
              macd_bullish_cross = (macd_line.iloc[-2] < signal_line.iloc[-2]) and (macd_line.iloc[-1] > signal_line.iloc[-1])
              macd_bearish_cross = (macd_line.iloc[-2] > signal_line.iloc[-2]) and (macd_line.iloc[-1] < signal_line.iloc[-1])
              
              # ✅ Bollinger Bands
              sma20 = close.rolling(20).mean().iloc[-1]
              std20 = close.rolling(20).std().iloc[-1]
              bb_upper = sma20 + (2 * std20)
              bb_lower = sma20 - (2 * std20)
              price = close.iloc[-1]
              bb_position = (price - bb_lower) / (bb_upper - bb_lower)  # 0 = أسفل، 1 = أعلى
              
              # ✅ Volume (إذا موجود)
              volume_ok = True
              if "volume" in df.columns:
                  avg_vol = df["volume"].rolling(20).mean().iloc[-1]
                  current_vol = df["volume"].iloc[-1]
                  volume_ok = current_vol > avg_vol * 0.8
              
              # Breakout
              prev_close = close.iloc[-2]
              support_prev, resistance_prev = find_nearest_levels(df.iloc[:-2])
              bullish_breakout = (price > resistance_prev) and (prev_close > resistance_prev)
              bearish_breakout = (price < support_prev) and (prev_close < support_prev)
              support, resistance = find_nearest_levels(df)
              
              return {
                  "price": price, "atr": atr, "rsi": rsi, "adx": adx,
                  "support": support, "resistance": resistance,
                  "bullish_breakout": bool(bullish_breakout),
                  "bearish_breakout": bool(bearish_breakout),
                  "trend_up": ema50 > ema200,
                  "trend_down": ema50 < ema200,
                  "adx_ok": adx > ADX_THRESHOLD,
                  "macd_hist": macd_hist,
                  "macd_bullish_cross": macd_bullish_cross,
                  "macd_bearish_cross": macd_bearish_cross,
                  "bb_position": bb_position,
                  "volume_ok": volume_ok,
              }

          def passes_conditions(ind):
              # شروط أساسية
              if not ind["adx_ok"]:
                  return None
              if not ind["volume_ok"]:
                  return None
              
              # ✅ شروط MACD + Bollinger
              if ind["trend_up"] and ind["bullish_breakout"] and ind["rsi"] > RSI_BUY_THRESHOLD:
                  # MACD إيجابي + Bollinger ما بحدود الذروة
                  if ind["macd_hist"] > 0 and ind["bb_position"] < 0.95:
                      return "صاعد"
              
              if ind["trend_down"] and ind["bearish_breakout"] and ind["rsi"] < RSI_SELL_THRESHOLD:
                  # MACD سلبي + Bollinger ما بحدود القاع
                  if ind["macd_hist"] < 0 and ind["bb_position"] > 0.05:
                      return "هابط"
              
              return None

          def backtest_pair(df):
              trades = []
              in_trade = False
              stop = target = trade_direction = None
              i = 300
              while i < len(df) - 1:
                  if not in_trade:
                      window_df = df.iloc[:i+1]
                      ind = compute_indicators(window_df)
                      direction = passes_conditions(ind)
                      if direction:
                          entry = ind["price"]
                          stop_dist = ind["atr"] * ATR_MULTIPLIER
                          profit_dist = stop_dist * RR_RATIO
                          if direction == "صاعد":
                              stop = entry - stop_dist
                              target = entry + profit_dist
                          else:
                              stop = entry + stop_dist
                              target = entry - profit_dist
                          in_trade = True
                          trade_direction = direction
                  else:
                      candle = df.iloc[i]
                      hit_target = hit_stop = False
                      if trade_direction == "صاعد":
                          if candle["low"] <= stop:
                              hit_stop = True
                          elif candle["high"] >= target:
                              hit_target = True
                      else:
                          if candle["high"] >= stop:
                              hit_stop = True
                          elif candle["low"] <= target:
                              hit_target = True
                      if hit_target or hit_stop:
                          trades.append({"result": "ربح" if hit_target else "خسارة"})
                          in_trade = False
                  i += 1
              return trades

          print("=" * 70)
          print("🆕 باك تست الوسط + مؤشرات جديدة (MACD + Bollinger + Volume)")
          print(f"ATR: {ATR_MULTIPLIER} | ADX: {ADX_THRESHOLD} | RSI: {RSI_BUY_THRESHOLD}/{RSI_SELL_THRESHOLD}")
          print(f"الأزواج: {len(PAIRS)}")
          print("=" * 70)
          
          all_results = {}
          for pair in PAIRS:
              df = fetch_history(pair)
              if df is None or len(df) < 350:
                  print(f"❌ {pair}: بيانات غير كافية")
                  continue
              trades = backtest_pair(df)
              wins = sum(1 for t in trades if t["result"] == "ربح")
              losses = sum(1 for t in trades if t["result"] == "خسارة")
              total = len(trades)
              winrate = round((wins / total) * 100, 1) if total else 0
              print(f"📊 {pair}: {total} صفقة | ربح: {wins} | خسارة: {losses} | Win Rate: {winrate}%")
              all_results[pair] = {"total": total, "wins": wins, "losses": losses}
              time.sleep(8)

          total_trades = sum(v["total"] for v in all_results.values())
          total_wins = sum(v["wins"] for v in all_results.values())
          total_losses = sum(v["losses"] for v in all_results.values())
          overall_winrate = round((total_wins / total_trades) * 100, 1) if total_trades else 0
          
          print()
          print("=" * 70)
          print("📈 الإجمالي الجديد")
          print("=" * 70)
          print(f"إجمالي الصفقات: {total_trades}")
          print(f"الرابحة: {total_wins} | الخاسرة: {total_losses}")
          print(f"✅ Win Rate: {overall_winrate}%")
          print()
          print("📋 للمقارنة:")
          print("  - القديم 1 (RSI 55/45, ADX 25, ATR 1.5, 8 أزواج): 31.5%")
          print("  - الجديد 1 (RSI 60/40, ADX 30, ATR 2.0, 6 أزواج): 27.9%")
          print(f"  - الجديد 2 (وسط + MACD + Bollinger + Volume): {overall_winrate}%")
          
          if overall_winrate > 31.5:
              print(f"🎉 تحسن عن الأصلي بمقدار {round(overall_winrate - 31.5, 1)} نقطة مئوية!")
          elif overall_winrate == 31.5:
              print("😐 نفس النتيجة - نحتاج تعديلات أعمق")
          else:
              print(f"😔 تراجع عن الأصلي بمقدار {round(31.5 - overall_winrate, 1)} نقطة مئوية")
          print("=" * 70)
          EOF
