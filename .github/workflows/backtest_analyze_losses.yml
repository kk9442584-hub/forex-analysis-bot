name: Wave Strategy Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Wave strategy backtest with multi-timeframe
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          pip install requests pandas numpy
          python3 << 'EOF'
          import requests, os, time
          import pandas as pd
          import numpy as np

          TWELVE_DATA_KEY = os.environ["TWELVE_DATA_KEY"]
          PAIRS = ["EUR/USD", "GBP/USD", "USD/JPY", "USD/CHF", "AUD/USD"]
          # شلنا USD/CAD لأنه ضعيف
          
          # إعدادات الاستراتيجية
          MIN_WAVE_SIZE_ATR = 1.5  # حجم الموجة الأدنى (بمضاعفات ATR)
          WAVE_LOOKBACK = 30       # عدد شموع H1 للبحث عن الموجة
          MIN_WAVE_DURATION = 10   # أقل مدة للموجة (شموع H1)
          FIBO_TARGET = 0.5        # 50% فيبو

          def fetch_data(pair, interval, outputsize=1000):
              url = "https://api.twelvedata.com/time_series"
              params = {
                  "symbol": pair, 
                  "interval": interval, 
                  "outputsize": outputsize, 
                  "apikey": TWELVE_DATA_KEY
              }
              r = requests.get(url, params=params, timeout=30)
              data = r.json()
              values = data.get("values")
              if not values:
                  return None
              df = pd.DataFrame(values)
              for col in ["close", "high", "low", "open"]:
                  df[col] = df[col].astype(float)
              df = df.iloc[::-1].reset_index(drop=True)
              return df

          def find_swing_points(df, lookback=5):
              """يجد القمم والقيعان الرئيسية (Swing Points)"""
              highs = df["high"].values
              lows = df["low"].values
              
              swing_highs = []  # (index, price)
              swing_lows = []   # (index, price)
              
              for i in range(lookback, len(df) - lookback):
                  # قمة: أعلى من window شمعة قبلها و بعدها
                  window_high = highs[i-lookback:i+lookback+1]
                  if highs[i] == max(window_high) and highs[i] > highs[i-1] and highs[i] > highs[i+1]:
                      swing_highs.append((i, highs[i]))
                  
                  # قاع: أدنى من window شمعة قبلها و بعدها
                  window_low = lows[i-lookback:i+lookback+1]
                  if lows[i] == min(window_low) and lows[i] < lows[i-1] and lows[i] < lows[i+1]:
                      swing_lows.append((i, lows[i]))
              
              return swing_highs, swing_lows

          def detect_wave_h1(df_h1):
              """يكتشف الموجة الحالية على فريم الساعة"""
              atr_h1 = (df_h1["high"] - df_h1["low"]).rolling(14).mean().iloc[-1]
              
              swing_highs, swing_lows = find_swing_points(df_h1, lookback=5)
              
              if len(swing_highs) < 1 or len(swing_lows) < 1:
                  return None
              
              # نبحث عن آخر موجة مكتملة
              # موجة صاعدة: قاع → قمة
              # موجة هابطة: قمة → قاع
              
              last_swing_low = swing_lows[-1]
              last_swing_high = swing_highs[-1]
              
              current_price = df_h1["close"].iloc[-1]
              
              # تحديد نوع الموجة
              if last_swing_low[0] > last_swing_high[0]:
                  # آخر حدث كان قاع → موجة صاعدة محتملة
                  wave_type = "صاعدة"
                  wave_start_idx, wave_start_price = last_swing_low
                  wave_end_idx, wave_end_price = last_swing_high
                  # النقطة اللي بدنا نكسرها
                  breakout_level = wave_end_price
                  # الستوب: تحت القاع
                  stop_level = wave_start_price
              else:
                  # آخر حدث كان قمة → موجة هابطة محتملة
                  wave_type = "هابطة"
                  wave_start_idx, wave_start_price = last_swing_high
                  wave_end_idx, wave_end_price = last_swing_low
                  breakout_level = wave_end_price
                  stop_level = wave_start_price
              
              # حساب حجم الموجة
              wave_size = abs(wave_end_price - wave_start_price)
              
              # فلاتر: موجة قوية فقط
              if wave_size < atr_h1 * MIN_WAVE_SIZE_ATR:
                  return None  # موجة صغيرة، نتجاهلها
              
              # حساب المدة
              wave_duration = wave_end_idx - wave_start_idx
              if wave_duration < MIN_WAVE_DURATION:
                  return None  # موجة سريعة جداً (ضوضاء)
              
              return {
                  "type": wave_type,
                  "size": wave_size,
                  "breakout_level": breakout_level,
                  "stop_level": stop_level,
                  "target": breakout_level + (wave_size * FIBO_TARGET) if wave_type == "صاعدة" else breakout_level - (wave_size * FIBO_TARGET),
                  "start_idx": wave_start_idx,
                  "end_idx": wave_end_idx,
              }

          def check_breakout_m15(df_m15, wave):
              """يفحص إذا في انكسار على فريم 15 دقيقة"""
              if wave is None:
                  return None
              
              # نشوف آخر شمعة مغلقة
              last_candle = df_m15.iloc[-1]
              prev_candle = df_m15.iloc[-2]
              
              if wave["type"] == "صاعدة":
                  # انكسار صاعد: إغلاق فوق المقاومة
                  if last_candle["close"] > wave["breakout_level"] and prev_candle["close"] <= wave["breakout_level"]:
                      return "صاعد"
              else:
                  # انكسار هابط: إغلاق تحت الدعم
                  if last_candle["close"] < wave["breakout_level"] and prev_candle["close"] >= wave["breakout_level"]:
                      return "هابط"
              
              return None

          def backtest_wave_strategy(df_h1, df_m15):
              """باك تست الاستراتيجية"""
              trades = []
              in_trade = False
              current_trade = None
              
              # محاذاة الفريمات
              min_len = min(len(df_h1) * 4, len(df_m15))  # كل شمعة H1 = 4 شموع M15
              df_m15_aligned = df_m15.iloc[:min_len].reset_index(drop=True)
              
              # نختبر كل 4 شموع M15 (يعني كل شمعة H1)
              for i in range(100, len(df_m15_aligned) - 1, 4):
                  if not in_trade:
                      # نحدد الموجة من البيانات حتى النقطة i
                      h1_idx = i // 4
                      if h1_idx < 50:
                          continue
                      
                      df_h1_window = df_h1.iloc[:h1_idx+1]
                      wave = detect_wave_h1(df_h1_window)
                      
                      if wave is None:
                          continue
                      
                      # نفحص الانكسار على M15
                      df_m15_window = df_m15_aligned.iloc[:i+1]
                      direction = check_breakout_m15(df_m15_window, wave)
                      
                      if direction:
                          entry_price = wave["breakout_level"]
                          in_trade = True
                          current_trade = {
                              "entry": entry_price,
                              "stop": wave["stop_level"],
                              "target": wave["target"],
                              "direction": direction,
                              "wave_size": wave["size"],
                          }
                  else:
                      # نشوف إذا ضرب SL أو TP
                      candle = df_m15_aligned.iloc[i]
                      
                      if current_trade["direction"] == "صاعد":
                          if candle["low"] <= current_trade["stop"]:
                              trades.append({"result": "خسارة", "entry": current_trade["entry"]})
                              in_trade = False
                          elif candle["high"] >= current_trade["target"]:
                              trades.append({"result": "ربح", "entry": current_trade["entry"]})
                              in_trade = False
                      else:
                          if candle["high"] >= current_trade["stop"]:
                              trades.append({"result": "خسارة", "entry": current_trade["entry"]})
                              in_trade = False
                          elif candle["low"] <= current_trade["target"]:
                              trades.append({"result": "ربح", "entry": current_trade["entry"]})
                              in_trade = False
              
              return trades

          print("=" * 70)
          print("🌊 باك تست استراتيجية الموجات (Wave Strategy)")
          print(f"الأزواج: {len(PAIRS)} | فيبو: {FIBO_TARGET*100}% | حجم موج أدنى: {MIN_WAVE_SIZE_ATR}x ATR")
          print("=" * 70)
          
          all_results = {}
          for pair in PAIRS:
              print(f"\n⏳ جاري تحليل {pair}...")
              df_h1 = fetch_data(pair, "1h", 500)
              df_m15 = fetch_data(pair, "15min", 2000)
              
              if df_h1 is None or df_m15 is None or len(df_h1) < 100 or len(df_m15) < 500:
                  print(f"❌ {pair}: بيانات غير كافية")
                  continue
              
              trades = backtest_wave_strategy(df_h1, df_m15)
              wins = sum(1 for t in trades if t["result"] == "ربح")
              losses = sum(1 for t in trades if t["result"] == "خسارة")
              total = len(trades)
              winrate = round((wins / total) * 100, 1) if total else 0
              print(f"📊 {pair}: {total} صفقة | ربح: {wins} | خسارة: {losses} | Win Rate: {winrate}%")
              all_results[pair] = {"total": total, "wins": wins, "losses": losses}
              time.sleep(8)

          total_trades = sum(v["total"] for v in all_results.values())
          total_wins = sum(v["wins"] for v in all_results.values())
          total_losses = sum(v["losses"] for v in all_results.values())
          overall_winrate = round((total_wins / total_trades) * 100, 1) if total_trades else 0
          
          print()
          print("=" * 70)
          print("📈 الإجمالي")
          print("=" * 70)
          print(f"إجمالي الصفقات: {total_trades}")
          print(f"الرابحة: {total_wins} | الخاسرة: {total_losses}")
          print(f"✅ Win Rate: {overall_winrate}%")
          print()
          print("📋 للمقارنة:")
          print("  - القديم (RSI 55/45, ADX 25, ATR 1.5): 31.5%")
          print("  - الوسط + MACD + Bollinger: 35.4%")
          print(f"  - 🆕 الموجات (Wave Strategy): {overall_winrate}%")
          
          if overall_winrate > 35.4:
              print(f"🎉 تحسن عن الوسط بمقدار {round(overall_winrate - 35.4, 1)} نقطة!")
          elif overall_winrate == 35.4:
              print("😐 نفس نتيجة الوسط")
          else:
              print(f"😔 تراجع عن الوسط بمقدار {round(35.4 - overall_winrate, 1)} نقطة")
          print("=" * 70)
          EOF
